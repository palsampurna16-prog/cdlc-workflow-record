<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SkillCat Jira</title>
<meta name="description" content="How a CDLC course Epic is built in Jira: its workflow, every stage beneath it, and every subtask beneath those, down to the bottom of the tree.">
<!-- Internal reference. Asks well-behaved crawlers not to index this page.
     This is not access control: the repository is public and so is this file. -->
<meta name="robots" content="noindex, nofollow">
<style>:root { color-scheme: light dark; } body { margin: 0; }</style>
</head>
<body>
<style>
  :root {
    --c-surface:#FFFFFF; --c-surface-sunken:#F7F8F9; --c-surface-hover:#F1F2F4; --c-surface-press:#DCDFE4;
    --c-text:#172B4D; --c-text-subtle:#44546F; --c-text-subtlest:#626F86; --c-text-inverse:#FFFFFF;
    --c-border:#091E4224; --c-border-strong:#8590A2;
    --c-brand:#0C66E4; --c-link:#0C66E4;
    --c-blue:#1868DB; --c-purple:#6E5DC6; --c-green:#22A06B; --c-orange:#E56910;
    --c-info-bg:#E9F2FE; --c-info-br:#8FB8F6;
    --c-warn-bg:#FFF7D6; --c-warn-br:#F5CD47;
    --radius-sm:3px; --radius:6px; --radius-lg:8px;
    --shadow-raised:0 1px 1px #091E4240, 0 0 1px #091E424F;
    --shadow-overlay:0 8px 12px #091E4226, 0 0 1px #091E424F;
    --space-050:4px; --space-100:8px; --space-150:12px; --space-200:16px;
    --space-300:24px; --space-400:32px; --space-600:48px;
    --nav-height:56px;
    --font-sans: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
    --duration:100ms; --ease:cubic-bezier(0.2,0,0,1);
  }
  *,*::before,*::after { box-sizing:border-box; }
  body { margin:0; font-family:var(--font-sans); font-size:14px; line-height:1.42857;
         color:var(--c-text); background:var(--c-surface); -webkit-font-smoothing:antialiased; }
  a { color:var(--c-link); text-decoration:none; }
  a:hover { text-decoration:underline; }
  :focus-visible { outline:2px solid var(--c-brand); outline-offset:2px; border-radius:var(--radius-sm); }

  /* nav */
  .nav { position:sticky; top:0; z-index:10; display:flex; align-items:center; gap:var(--space-100);
         height:var(--nav-height); padding:0 var(--space-100);
         background:var(--c-surface); border-bottom:1px solid var(--c-border); }
  .nav-btn { display:grid; place-items:center; width:32px; height:32px; border:0; border-radius:var(--radius);
             background:transparent; color:var(--c-text-subtle); cursor:pointer;
             transition:background-color var(--duration) var(--ease); }
  .nav-btn:hover { background:var(--c-surface-hover); }
  .wordmark { display:flex; align-items:center; gap:var(--space-100); padding:0 var(--space-100);
              font-size:16px; font-weight:600; letter-spacing:-0.01em; color:var(--c-text);
              cursor:pointer; background:none; border:0; font-family:inherit; border-radius:var(--radius); }
  .wordmark:hover { background:var(--c-surface-hover); }
  .search { flex:0 1 460px; margin-left:var(--space-100); position:relative; }
  .search input { width:100%; height:32px; padding:0 var(--space-150) 0 34px; font:inherit; color:var(--c-text);
                  background:var(--c-surface); border:1px solid var(--c-border-strong); border-radius:var(--radius-sm); }
  .search input:focus { outline:none; border-color:var(--c-brand); box-shadow:inset 0 0 0 1px var(--c-brand); }
  .search svg { position:absolute; left:10px; top:50%; transform:translateY(-50%);
                color:var(--c-text-subtle); pointer-events:none; }
  .nav-spacer { flex:1; }
  .avatar-me { width:32px; height:32px; border-radius:50%; background:var(--c-purple);
               color:var(--c-text-inverse); display:grid; place-items:center;
               font-size:12px; font-weight:600; }

  /* shell */
  .page { max-width:1240px; margin:0 auto; padding:var(--space-400) var(--space-400) var(--space-600); }
  .crumbs { display:flex; align-items:center; gap:var(--space-050); margin-bottom:var(--space-150);
            font-size:12px; color:var(--c-text-subtle); flex-wrap:wrap; }
  .crumbs button { background:none; border:0; padding:0; font:inherit; color:var(--c-link);
                   cursor:pointer; border-radius:var(--radius-sm); }
  .crumbs button:hover { text-decoration:underline; }
  .crumbs .sep { color:var(--c-text-subtlest); }
  h1 { margin:0; font-size:24px; font-weight:600; letter-spacing:-0.01em; }
  h2 { margin:var(--space-400) 0 var(--space-150); font-size:16px; font-weight:600; }
  .lede { margin:var(--space-100) 0 0; max-width:70ch; color:var(--c-text-subtle); }
  .page-head { margin-bottom:var(--space-300); }
  .eyebrow { margin:0 0 var(--space-050); font-size:11px; font-weight:700; letter-spacing:0.08em;
             text-transform:uppercase; color:var(--c-text-subtlest); }

  /* project cards */
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(264px,1fr)); gap:var(--space-200); }
  .card { display:flex; flex-direction:column; height:100%; gap:var(--space-150); padding:var(--space-200);
          text-align:left; font:inherit; color:inherit; background:var(--c-surface);
          border:1px solid var(--c-border); border-radius:var(--radius-lg); box-shadow:var(--shadow-raised);
          cursor:pointer; transition:transform var(--duration) var(--ease),
          box-shadow var(--duration) var(--ease), background-color var(--duration) var(--ease); }
  .card:hover { background:var(--c-surface-sunken); box-shadow:var(--shadow-overlay); transform:translateY(-2px); }
  .card:active { transform:translateY(0); }
  .card-top { display:flex; align-items:center; gap:var(--space-150); }
  .pavatar { flex:none; width:40px; height:40px; border-radius:var(--radius); display:grid; place-items:center;
             font-size:13px; font-weight:700; color:var(--c-text-inverse); }
  .pavatar.lg { width:48px; height:48px; font-size:15px; }
  .tone-blue{background:var(--c-blue);} .tone-purple{background:var(--c-purple);}
  .tone-green{background:var(--c-green);} .tone-orange{background:var(--c-orange);}
  .card-name { font-size:14px; font-weight:600; line-height:1.3; }
  .card-key { margin-top:2px; font-size:12px; color:var(--c-text-subtlest); }
  .card-meta { display:flex; margin-top:auto; align-items:center; gap:var(--space-100);
               padding-top:var(--space-150); border-top:1px solid var(--c-border);
               font-size:12px; color:var(--c-text-subtle); }
  .lozenge { display:inline-block; padding:0 var(--space-050); font-size:11px; font-weight:700;
             text-transform:uppercase; letter-spacing:0.06em; line-height:16px;
             border-radius:var(--radius-sm); background:var(--c-surface-press); color:var(--c-text-subtle); }
  .count { font-variant-numeric:tabular-nums; }

  /* space header */
  .space-head { display:flex; align-items:center; gap:var(--space-200); margin-bottom:var(--space-300); }
  .empty { margin-top:var(--space-300); padding:var(--space-600) var(--space-400); text-align:center;
           background:var(--c-surface-sunken); border:1px solid var(--c-border); border-radius:var(--radius-lg); }
  .empty h2 { margin:0 0 var(--space-100); }
  .empty p { margin:0 auto; max-width:46ch; color:var(--c-text-subtle); }
  .no-results { padding:var(--space-400); color:var(--c-text-subtle); }

  /* workflow strip */
  .flowline { display:flex; align-items:center; flex-wrap:wrap; gap:var(--space-100);
              padding:var(--space-200); background:var(--c-surface-sunken);
              border:1px solid var(--c-border); border-radius:var(--radius-lg); }
  .status { display:inline-block; padding:2px var(--space-100); font-size:12px; font-weight:600;
            line-height:18px; border-radius:var(--radius-sm);
            background:var(--c-surface-press); color:var(--c-text-subtle); }
  .status.todo { background:#DCDFE4; color:#44546F; }
  .status.prog { background:#E9F2FE; color:#0055CC; }
  .status.done { background:#DCFFF1; color:#216E4E; }
  .arrow { color:var(--c-text-subtlest); font-size:13px; }
  .side { margin-top:var(--space-150); font-size:12px; color:var(--c-text-subtlest); }

  /* stage sequence */
  .stages { display:flex; align-items:stretch; gap:var(--space-100); flex-wrap:wrap; }
  .stage { flex:1 1 200px; min-width:190px; display:flex; flex-direction:column; gap:var(--space-100);
           padding:var(--space-200); text-align:left; font:inherit; color:inherit;
           background:var(--c-surface); border:1px solid var(--c-border);
           border-radius:var(--radius-lg); box-shadow:var(--shadow-raised); cursor:pointer;
           transition:transform var(--duration) var(--ease), box-shadow var(--duration) var(--ease),
                      background-color var(--duration) var(--ease); }
  .stage:hover { background:var(--c-surface-sunken); box-shadow:var(--shadow-overlay); transform:translateY(-2px); }
  .stage.ghost { border-style:dashed; box-shadow:none; background:var(--c-surface-sunken); }
  .stage-n { font-size:11px; font-weight:700; letter-spacing:0.08em; text-transform:uppercase;
             color:var(--c-text-subtlest); }
  .stage-name { font-size:14px; font-weight:600; line-height:1.3; }
  .stage-type { font-size:12px; color:var(--c-text-subtlest); word-break:break-word; }
  .stage-meta { margin-top:auto; padding-top:var(--space-100); border-top:1px solid var(--c-border);
                font-size:12px; color:var(--c-text-subtle); }
  .seq-arrow { align-self:center; color:var(--c-text-subtlest); font-size:16px; }

  /* detail */
  .facts { display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:var(--space-200);
           padding:var(--space-200); background:var(--c-surface-sunken);
           border:1px solid var(--c-border); border-radius:var(--radius-lg); }
  .fact dt { font-size:11px; font-weight:700; letter-spacing:0.08em; text-transform:uppercase;
             color:var(--c-text-subtlest); margin-bottom:var(--space-050); }
  .fact dd { margin:0; font-size:14px; font-weight:600; }
  .rows { border:1px solid var(--c-border); border-radius:var(--radius-lg); overflow:hidden; }
  .row { display:flex; align-items:center; gap:var(--space-150); padding:var(--space-150) var(--space-200);
         border-bottom:1px solid var(--c-border); }
  .row:last-child { border-bottom:0; }
  .row:nth-child(odd) { background:var(--c-surface-sunken); }
  .row-n { flex:none; width:22px; font-size:12px; font-variant-numeric:tabular-nums;
           color:var(--c-text-subtlest); }
  .row-name { font-weight:600; }
  .row-type { margin-left:auto; font-size:12px; color:var(--c-text-subtlest); text-align:right; }
  .note { margin-top:var(--space-300); padding:var(--space-150) var(--space-200);
          background:var(--c-warn-bg); border:1px solid var(--c-warn-br);
          border-radius:var(--radius); color:var(--c-text); }
  .note strong { display:block; margin-bottom:var(--space-050); font-size:12px;
                 text-transform:uppercase; letter-spacing:0.06em; }
  .chips { display:flex; flex-wrap:wrap; gap:var(--space-100); }


  /* clickable subtask rows */
  .rows button.row { width:100%; text-align:left; font:inherit; color:inherit;
                     background:none; border:0; border-bottom:1px solid var(--c-border); cursor:pointer;
                     transition:background-color var(--duration) var(--ease); }
  .rows button.row:last-child { border-bottom:0; }
  .rows button.row:nth-child(odd) { background:var(--c-surface-sunken); }
  .rows button.row:hover { background:var(--c-surface-press); }
  .row-go { flex:none; color:var(--c-text-subtlest); }

  /* workflow graph */
  .wf { display:flex; flex-direction:column; gap:var(--space-100);
        padding:var(--space-200); background:var(--c-surface-sunken);
        border:1px solid var(--c-border); border-radius:var(--radius-lg); }
  .wf-row { display:flex; align-items:center; flex-wrap:wrap; gap:var(--space-100); }
  .wf-from { font-size:11px; font-weight:700; letter-spacing:0.06em; text-transform:uppercase;
             color:var(--c-text-subtlest); margin-right:var(--space-050); }
  .wf-arrow { color:var(--c-text-subtlest); }
  .wf-or { font-size:11px; color:var(--c-text-subtlest); }
  .wf-label { font-size:12px; color:var(--c-text-subtle); font-style:italic; }
  .terminal { margin-top:var(--space-300); padding:var(--space-150) var(--space-200);
              background:var(--c-info-bg); border:1px solid var(--c-info-br);
              border-radius:var(--radius); font-size:13px; }
  .example { margin-top:var(--space-150); font-size:12px; color:var(--c-text-subtle); }


  /* centred single-column flow for the epic page */
  .col { max-width:720px; }

  .stages.vertical { flex-direction:column; align-items:stretch; gap:0; }
  .stages.vertical .stage { flex:none; width:100%; min-width:0; }
  .stages.vertical .seq-arrow { align-self:center; padding:var(--space-100) 0;
                                font-size:20px; line-height:1; }
  .stage-head { display:flex; align-items:baseline; gap:var(--space-150); }
  .stage-head .stage-name { font-size:16px; }
  .stage-row { display:flex; align-items:center; justify-content:space-between;
               gap:var(--space-150); flex-wrap:wrap; }


  /* course type fork */
  .fork { display:grid; grid-template-columns:repeat(auto-fit,minmax(280px,1fr)); gap:var(--space-200); }
  .fork-branch { padding:var(--space-200); background:var(--c-surface); border:1px solid var(--c-border);
                 border-radius:var(--radius-lg); box-shadow:var(--shadow-raised); }
  .fork-branch { text-align:left; font:inherit; color:inherit; cursor:pointer;
                 transition:background-color var(--duration) var(--ease),
                            border-color var(--duration) var(--ease),
                            box-shadow var(--duration) var(--ease); }
  .fork-branch:hover { background:var(--c-surface-sunken); }
  .fork-branch[aria-pressed="true"] { background:var(--c-info-bg); border-color:var(--c-brand);
                 box-shadow:inset 0 0 0 1px var(--c-brand); }
  .fork-type { display:block; font-size:14px; font-weight:600; margin-bottom:var(--space-150); }
  .fork-line { display:flex; gap:var(--space-100); padding:var(--space-100) 0;
               border-top:1px solid var(--c-border); font-size:13px; }
  .fork-k { flex:none; width:96px; color:var(--c-text-subtlest); font-size:12px; }
  .fork-v { color:var(--c-text); }
  .fork-then { display:block; margin-top:var(--space-150); padding-top:var(--space-150);
               border-top:1px solid var(--c-border); font-size:12px; color:var(--c-text-subtle); }
  .caption { margin-top:var(--space-150); font-size:12px; color:var(--c-text-subtlest); }


  /* history */
  .hist-month { margin:var(--space-400) 0 var(--space-100); font-size:12px; font-weight:700;
                letter-spacing:0.08em; text-transform:uppercase; color:var(--c-text-subtlest); }
  .hist { border:1px solid var(--c-border); border-radius:var(--radius-lg); overflow:hidden; }
  .hist button { display:flex; align-items:center; gap:var(--space-150); width:100%;
                 padding:var(--space-150) var(--space-200); text-align:left; font:inherit; color:inherit;
                 background:none; border:0; border-bottom:1px solid var(--c-border); cursor:pointer;
                 transition:background-color var(--duration) var(--ease); }
  .hist button:last-child { border-bottom:0; }
  .hist button:nth-child(odd) { background:var(--c-surface-sunken); }
  .hist button:hover { background:var(--c-surface-press); }
  .hist-day { flex:none; width:26px; font-size:12px; font-variant-numeric:tabular-nums;
              color:var(--c-text-subtlest); }
  .hist-title { font-weight:600; }
  .hist-key { flex:none; font-size:12px; color:var(--c-text-subtlest); }
  .hist-out { flex:none; margin-left:auto; }
  .ba { display:grid; grid-template-columns:repeat(auto-fit,minmax(260px,1fr)); gap:var(--space-200); }
  .ba-box { padding:var(--space-200); border:1px solid var(--c-border); border-radius:var(--radius-lg); }
  .ba-box.after { background:var(--c-info-bg); border-color:var(--c-info-br); }
  .ba-k { display:block; font-size:11px; font-weight:700; letter-spacing:0.08em;
          text-transform:uppercase; color:var(--c-text-subtlest); margin-bottom:var(--space-100); }
  .body code { padding:1px 4px; background:var(--c-surface-press); border-radius:var(--radius-sm);
               font-size:0.92em; }
  .body { max-width:70ch; }


  /* linear workflow: boxes left to right */
  .flow2 { display:flex; align-items:center; flex-wrap:wrap; gap:var(--space-050) var(--space-100);
           padding:var(--space-200); background:var(--c-surface-sunken);
           border:1px solid var(--c-border); border-radius:var(--radius-lg); }
  .box { padding:var(--space-100) var(--space-150); font-size:13px; font-weight:600;
         border-radius:var(--radius); border:1px solid transparent; white-space:nowrap; }
  .box.start { background:#DCDFE4; border-color:#B3B9C4; color:#44546F; }
  .box.mid   { background:#E9F2FE; border-color:#8FB8F6; color:#0055CC; }
  .box.end   { background:#DCFFF1; border-color:#7EE2B8; color:#216E4E; }
  .box.aside { background:var(--c-surface); border-color:var(--c-border-strong);
               border-style:dashed; color:var(--c-text-subtle); font-weight:500; }
  .flow2 .arrow { color:var(--c-text-subtlest); }
  .wf-example { margin-left:var(--space-400); font-size:12px; color:var(--c-text-subtlest);
                white-space:nowrap; }
  .aside-row { display:flex; align-items:center; flex-wrap:wrap; gap:var(--space-100);
               margin-top:var(--space-150); padding-top:var(--space-150);
               border-top:1px solid var(--c-border); }
  .aside-k { font-size:11px; font-weight:700; letter-spacing:0.06em; text-transform:uppercase;
             color:var(--c-text-subtlest); }


  /* section tabs */
  .tabs { display:flex; gap:var(--space-300); margin:var(--space-150) 0 var(--space-300);
          border-bottom:2px solid var(--c-border); }
  .tabs button { position:relative; padding:var(--space-100) 0 var(--space-150);
                 background:none; border:0; font:inherit; font-weight:600; font-size:14px;
                 color:var(--c-text-subtle); cursor:pointer;
                 transition:color var(--duration) var(--ease); }
  .tabs button:hover { color:var(--c-text); }
  .tabs button[aria-current="page"] { color:var(--c-brand); }
  .tabs button[aria-current="page"]::after { content:""; position:absolute; left:0; right:0;
      bottom:-2px; height:2px; background:var(--c-brand); border-radius:2px; }

  /* history filter toggles */
  .filters { display:flex; flex-wrap:wrap; gap:var(--space-100); margin-bottom:var(--space-200); }
  .filters button { display:inline-flex; align-items:center; gap:var(--space-050);
      padding:var(--space-050) var(--space-150); font:inherit; font-size:13px; font-weight:600;
      color:var(--c-text-subtle); background:var(--c-surface); cursor:pointer;
      border:1px solid var(--c-border-strong); border-radius:999px;
      transition:background-color var(--duration) var(--ease), color var(--duration) var(--ease),
                 border-color var(--duration) var(--ease); }
  .filters button:hover { background:var(--c-surface-hover); }
  .filters button[aria-pressed="true"] { background:var(--c-brand); border-color:var(--c-brand);
      color:var(--c-text-inverse); }
  .filters .n { font-weight:400; opacity:.75; font-variant-numeric:tabular-nums; }
  .empty-filter { padding:var(--space-400); text-align:center; color:var(--c-text-subtle); }


  /* fields and work types, by role */
  .fsub { margin:var(--space-500) 0 var(--space-100); font-size:11px; font-weight:700;
          letter-spacing:.06em; text-transform:uppercase; color:var(--c-text-subtlest); }
  .fgroup { margin-top:var(--space-300); padding-left:var(--space-200);
            border-left:3px solid var(--rc, var(--c-border-strong)); }
  .fgroup h3 { margin:0 0 var(--space-150); font-size:15px; font-weight:600; }
  .fgroup.orphan h3 { color:#974F0C; }
  .frow { display:flex; align-items:baseline; gap:var(--space-150);
          padding:var(--space-100) var(--space-200); border-bottom:1px solid var(--c-border); }
  .frow:last-child { border-bottom:0; }
  .frow:nth-child(odd) { background:var(--c-surface-sunken); }
  .fname { flex:0 0 190px; font-weight:600; font-size:13px; }
  .fname.wide { flex:1 1 auto; }
  .fhow { flex:1; font-size:13px; color:var(--c-text-subtle); }
  .fnote { display:block; margin-top:var(--space-050); font-style:normal; font-size:12px;
           color:var(--c-text-subtlest); padding-left:var(--space-100);
           border-left:2px solid var(--c-border-strong); }
  .ftag { display:inline-block; margin-left:var(--space-050); padding:0 var(--space-050);
          font-size:10px; font-weight:700; letter-spacing:.03em; text-transform:uppercase;
          color:#974F0C; background:#974F0C1a; border-radius:var(--radius-sm); vertical-align:1px; }


  /* request a change */
  .req { display:inline-flex; align-items:center; gap:var(--space-050);
         height:32px; padding:0 var(--space-150); font:inherit; font-size:13px; font-weight:600;
         color:var(--c-text-subtle); background:var(--c-surface); cursor:pointer;
         border:1px solid var(--c-border-strong); border-radius:var(--radius-sm);
         text-decoration:none; white-space:nowrap;
         transition:background-color var(--duration) var(--ease); }
  .req:hover { background:var(--c-surface-hover); text-decoration:none; color:var(--c-text); }

  @media (max-width:640px) {
    .page { padding:var(--space-300) var(--space-200) var(--space-400); }
    .search { display:none; }

/* ---------- routing ---------- */
function route() {
  const raw = decodeURIComponent(location.hash.replace(/^#\/?/, ""));
  const [key, stage, sub] = raw.split("/").filter(Boolean);
  const k = (key||"").toUpperCase();
  return { key: PROJECTS.some(p=>p.key===k) ? k : null, stage: stage||null, sub: sub||null };
}
const go = path => { location.hash = path ? "/"+path : "/"; };


const jiraLink = k =>
  `<a href="https://skillcatapp.atlassian.net/browse/${encodeURIComponent(k)}"
      target="_blank" rel="noopener noreferrer">${esc(k)}</a>`;

/* Lays a workflow out as a single left-to-right line.
   The line is the longest run of real transitions from the initial status, so it is
   the main path through the workflow rather than a hand-written sequence. Everything
   off that line, dead ends, and statuses reachable from anywhere, is set apart, so
   the main line stays readable. Colour follows position: start grey, middle blue,
   final green. */
function workflowGraph(tr, example) {
  if (!tr || !tr.length) return "";
  const start = (tr.find(t => t.kind === "start") || {}).to;
  const edges = tr.filter(t => t.kind === "edge");
  if (start === undefined) return "";

  const next = {};
  edges.forEach(e => (e.from || []).forEach(f => (next[f] = next[f] || []).push(e.to)));

  /* Longest run onward, never revisiting a status already on this path. Workflows
     loop back constantly, Done to To Do, review to In Progress, and without this
     the line follows a loop instead of finishing. */
  const best = (s, seen) => {
    let win = [];
    for (const t of new Set(next[s] || [])) {
      if (seen.has(t)) continue;
      const p = best(t, new Set([...seen, t]));
      if (p.length + 1 > win.length) win = [t, ...p];
    }
    return win;
  };

  const main = [start, ...best(start, new Set([start]))];
  const all = [...new Set(
    edges.flatMap(e => [...(e.from || []), e.to])
         .concat(tr.filter(t => t.kind === "any").map(t => t.to)))];
  const aside = all.filter(s => !main.includes(s));
  const tone = s => s === start ? "start" : s === main[main.length - 1] ? "end" : "mid";

  return `<div class="flow2">` +
    main.map((s, i) => (i ? `<span class="arrow">&rarr;</span>` : "") +
      `<span class="box ${tone(s)}">${esc(s)}</span>`).join("") +
    (example ? `<span class="wf-example">Live example: ${jiraLink(example)}</span>` : "") +
    (aside.length
      ? `<div class="aside-row" style="flex-basis:100%">
           <span class="aside-k">Also</span>` +
         aside.map(s => `<span class="box aside">${esc(s)}</span>`).join("") + `</div>`
      : "") +
  `</div>`;
}

/* Work type and workflow usually carry the same name, differing only by a
   "(sub-task)" suffix or capitalisation. Showing both every time is noise, so the
   workflow appears only where it is genuinely a different thing, Course: Specs
   running on CDLC: Task/Subtask, Course Metadata on SGP: Task, and so on. */
const norm = s => String(s).toLowerCase()
  .replace(/\(sub-?task\)/g, "").replace(/^cdlc:\s*/, "").replace(/[^a-z0-9]+/g, " ").trim();

function facts(o, extra) {
  const showWf = o.workflow && norm(o.workflow) !== norm(o.type);
  return `<dl class="facts">` +
     (extra ? `<div class="fact"><dt>Created</dt><dd style="font-weight:400">${esc(extra)}</dd></div>` : "") +
     `<div class="fact"><dt>Work type</dt><dd>${esc(o.type)}</dd></div>` +
     (showWf ? `<div class="fact"><dt>Runs on workflow</dt><dd>${esc(o.workflow)}</dd></div>` : "") +
   `</dl>`;
}

const TAG = { dormant:"not in use", duplicate:"duplicate" };

/* One accent per role for the bar down the left of its group. Literal values so they
   read the same in light and dark, the way the orphan colour already does. */
const ROLE_ACCENT = {
  "Jira sets these":                       "#6B7280",
  "Instructional Designers' Team Manager":  "#7C3AED",
  "Instructional Designer":                 "#2563EB",
  "Visual Designer":                        "#0D9488",
  "Subject Matter Expert":                  "#DB2777",
  "Digitization":                           "#4F46E5",
  "Digitization Manager":                   "#0891B2",
  "Nobody assigned yet":                    "#974F0C",
};
const ROLES = Object.keys(ROLE_ACCENT);
const fieldUnused = r => r.length > 7 && r[7];   /* fields: flag at index 7 */
const typeUnused  = r => r.length > 1 && r[1];   /* work types: dormant at index 1 */

let fieldRole = new Set();
let hideUnused = false;

function viewFields() {
  const pick = t => !fieldRole.size || fieldRole.has(t);
  /* rows a role has after the not-in-use filter only; the role chips ignore each other */
  const rowsOf = (SET, dead) => t => {
    const g = SET.find(x => x[0] === t);
    return g ? g[2].filter(r => !(hideUnused && dead(r))) : [];
  };
  const allFieldRows = rowsOf(FIELDS, fieldUnused);
  const allTypeRows = rowsOf(OWNERS, typeUnused);
  const fieldRows = t => pick(t) ? allFieldRows(t) : [];
  const typeRows = t => pick(t) ? allTypeRows(t) : [];
  const count = t => allFieldRows(t).length + allTypeRows(t).length;
  const shown = ROLES.filter(pick).reduce((n,t) => n + count(t), 0);
  const unused = FIELDS.reduce((n,g) => n + g[2].filter(fieldUnused).length, 0)
               + OWNERS.reduce((n,g) => n + g[2].filter(typeUnused).length, 0);

  const chip = (val,label,n,on) =>
    `<button data-r="${esc(val)}" aria-pressed="${on}">${esc(label)} <span class="n">${n}</span></button>`;

  const group = (t, rows, body) => {
    const orphan = /^Nobody assigned/i.test(t);
    return `<section class="fgroup${orphan?" orphan":""}" style="--rc:${ROLE_ACCENT[t]}">
       <h3>${esc(t)}</h3>
       <div class="rows">${body}</div>
     </section>`;
  };

  const fieldGroups = ROLES.map(t => {
    const rows = fieldRows(t);
    return rows.length ? group(t, rows, rows.map(([name, , , how, , , note, flag]) =>
      `<div class="frow">
         <span class="fname">${esc(name)}${flag ? ` <span class="ftag">${esc(TAG[flag]||flag)}</span>` : ""}</span>
         <span class="fhow">${esc(how || "")}${note ? `<em class="fnote">${esc(note)}</em>` : ""}</span>
       </div>`).join("")) : "";
  }).join("");

  const typeGroups = ROLES.map(t => {
    const rows = typeRows(t);
    return rows.length ? group(t, rows, rows.map(([name]) =>
      `<div class="frow"><span class="fname wide">${esc(name)}</span></div>`).join("")) : "";
  }).join("");

  view.innerHTML =
    crumbs([{label:"Projects", to:""},{label:"CDLC", to:"CDLC"},{label:"Fields"}]) +
    `<div class="col">
       <div class="page-head"><h1>CDLC Epic</h1></div>
       ${tabs("fields")}
       <p class="lede">Pick a role to see the fields it fills and the work types it owns.</p>
       <div class="filters">` +
         chip("", "All roles", shown, !fieldRole.size) +
         ROLES.map(t => chip(t, t, count(t), fieldRole.has(t))).join("") +
       `</div>` +
       (unused ? `<div class="filters"><button data-x="1" aria-pressed="${hideUnused}">Hide fields and types not in use <span class="n">${unused}</span></button></div>` : "") +
       (fieldGroups ? `<h2 class="fsub">Fields</h2>${fieldGroups}` : "") +
       (typeGroups ? `<h2 class="fsub">Work types</h2>${typeGroups}` : "") +
       (!fieldGroups && !typeGroups ? `<p class="empty-filter">Nothing to show for that.</p>` : "") +
    `</div>`;

  wireCrumbs(); wireTabs();
  view.querySelectorAll('.filters button[data-r]').forEach(el =>
    el.addEventListener("click", () => {
      const r = el.dataset.r;
      if (!r) fieldRole.clear();
      else fieldRole.has(r) ? fieldRole.delete(r) : fieldRole.add(r);
      viewFields(); window.scrollTo({ top: 0 });
    }));
  const x = view.querySelector('.filters button[data-x]');
  if (x) x.addEventListener("click", () => { hideUnused = !hideUnused; viewFields(); window.scrollTo({ top: 0 }); });
}

/* ---------- CDLC section tabs ---------- */
function tabs(active) {
  const items = [["epic","The Epic",""],["fields","Fields","fields"],
                 ["history","Change history","history"]];
  return `<div class="tabs">` + items.map(([id,label,to]) =>
    `<button data-to="CDLC/${to}"${id===active?' aria-current="page"':""}>${label}</button>`).join("") + `</div>`;
}
function wireTabs() {
  view.querySelectorAll(".tabs button").forEach(el =>
    el.addEventListener("click", () => go(el.dataset.to.replace(/\/$/, ""))));
}

":"Step added to Restore on SkillCat, after update spreadsheet","subTickets":[]},{"key":"CIP-52","date":"2025-11-13","state":"ok","outcome":"Shipped","title":"Implement updated review workflows","body":"Recorded only as \"apply the approved changes to the review workflows, update documentation and communicate the new process\". The approved changes themselves were not written down in the ticket.","affected":["Review","Miscellaneous"],"before":null,"after":null,"subTickets":[]}]/*__ENDC__*/;
const MONTHS=["January","February","March","April","May","June","July","August",
              "September","October","November","December"];
const monthOf = d => MONTHS[+d.slice(5,7)-1] + " " + d.slice(0,4);
const OUTCLS = { "Shipped":"done", "Discarded":"todo", "To Do":"todo" };
/* body is authored HTML limited to <code>; escape everything then restore that one tag */
const richText = t => esc(t)
  .replace(/&lt;(\/?code)&gt;/g, "<$1>")      /* the one tag the source uses */
  .replace(/&amp;(\w+|#\d+);/g, "&$1;");     /* source is already escaped, undo the double escape */

let histFilter = new Set();

function viewHistory() {
  const tags = {};
  CHANGES.forEach(c => (c.affected||[]).forEach(a => tags[a] = (tags[a]||0)+1));
  const order = Object.entries(tags).sort((a,b) => b[1]-a[1] || a[0].localeCompare(b[0]));

  const match = c => !histFilter.size || (c.affected||[]).some(a => histFilter.has(a));
  const rows = CHANGES.filter(match).sort((a,b) => b.date.localeCompare(a.date));

  let list = "", month = "";
  rows.forEach(c => {
    const m = monthOf(c.date);
    if (m !== month) { if (month) list += `</div>`; list += `<p class="hist-month">${esc(m)}</p><div class="hist">`; month = m; }
    list += `<button data-k="${esc(c.key)}">
       <span class="hist-day">${c.date.slice(8,10)}</span>
       <span class="hist-title">${esc(c.title)}</span>
       <span class="hist-key">${esc(c.key)}</span>
       <span class="hist-out"><span class="status ${OUTCLS[c.outcome]||"prog"}">${esc(c.outcome)}</span></span>
     </button>`;
  });
  if (month) list += `</div>`;

  view.innerHTML =
    crumbs([{label:"Projects", to:""},{label:"CDLC", to:"CDLC"},{label:"Change history"}]) +
    `<div class="col">
       <div class="page-head"><h1>CDLC Epic</h1></div>
       ${tabs("history")}
       <div class="filters">
         <button data-t="" aria-pressed="${histFilter.size?"false":"true"}">All
           <span class="n">${CHANGES.length}</span></button>` +
         order.map(([t,n]) =>
           `<button data-t="${esc(t)}" aria-pressed="${histFilter.has(t)}">${esc(t)}
              <span class="n">${n}</span></button>`).join("") +
    `  </div>` +
       (rows.length ? list
         : `<p class="empty-filter">No change touched that.</p>`) +
     `</div>`;

  wireCrumbs(); wireTabs();
  view.querySelectorAll(".filters button").forEach(el =>
    el.addEventListener("click", () => {
      const t = el.dataset.t;
      if (!t) histFilter.clear();
      else histFilter.has(t) ? histFilter.delete(t) : histFilter.add(t);
      viewHistory();
      window.scrollTo({ top: 0 });
    }));
  view.querySelectorAll(".hist button").forEach(el =>
    el.addEventListener("click", () => go("CDLC/history/"+el.dataset.k)));
}

function viewChange(key) {
  const c = CHANGES.find(x=>x.key===key);
  if (!c) return viewHistory();
  view.innerHTML =
    crumbs([{label:"Projects", to:""},{label:"CDLC", to:"CDLC"},
            {label:"Change history", to:"CDLC/history"},{label:c.key}]) +
    `<div class="col">
       <div class="page-head">
         <p class="eyebrow">${esc(monthOf(c.date))} &middot; ${jiraLink(c.key)}</p>
         <h1>${esc(c.title)}</h1>
       </div>
       <dl class="facts">
         <div class="fact"><dt>Outcome</dt><dd><span class="status ${OUTCLS[c.outcome]||"prog"}">${esc(c.outcome)}</span></dd></div>
         <div class="fact"><dt>Raised</dt><dd style="font-weight:400">${esc(c.date)}</dd></div>
         <div class="fact"><dt>Work types affected</dt><dd style="font-weight:400">${c.affected.length||"None"}</dd></div>
         <div class="fact"><dt>Sub-tickets</dt><dd style="font-weight:400">${c.subTickets.length||"None"}</dd></div>
       </dl>
       <h2>What was asked</h2>
       <p class="body">${richText(c.body)}</p>` +
    ((c.before||c.after) ? `<h2>Before and after</h2>
       <div class="ba">
         <div class="ba-box"><span class="ba-k">Before</span>${richText(c.before||"None recorded")}</div>
         <div class="ba-box after"><span class="ba-k">After</span>${richText(c.after||"None recorded")}</div>
       </div>` : "") +
    (c.affected.length ? `<h2>Work types affected</h2><div class="chips">` +
       c.affected.map(a=>`<span class="status prog">${esc(a)}</span>`).join("") + `</div>` : "") +
    (c.subTickets.length ? `<h2>Sub-tickets</h2><div class="rows">` +
       c.subTickets.map((t,i)=>`<div class="row"><span class="row-n">${i+1}</span>
          <span class="row-name">${esc(typeof t==="string"?t:(t.title||t.key||""))}</span>
          <span class="row-type">${esc(typeof t==="string"?"":(t.key||""))}</span></div>`).join("") + `</div>` : "") +
    `</div>`;
  wireCrumbs();
}

/* ---------- projects ---------- */
function viewProjects(filter="") {
  const q = filter.trim().toLowerCase();
  const shown = q ? PROJECTS.filter(p=>(p.key+" "+p.name).toLowerCase().includes(q)) : PROJECTS;
  view.innerHTML =
    `<div class="page-head"><h1>Projects</h1>
       <p class="lede">The four Jira spaces this record covers. Open one to go further.</p></div>` +
    (shown.length
      ? `<div class="grid">` + shown.map(p =>
          `<button class="card" data-key="${esc(p.key)}">
             <div class="card-top">${avatar(p)}
               <div><div class="card-name">${esc(p.name)}</div>
                    <div class="card-key">${esc(p.key)}</div></div></div>
             <div class="card-meta"><span class="lozenge">${esc(p.type)}</span>
               <span class="count">${p.issues.toLocaleString()} issues</span></div>
           </button>`).join("") + `</div>`
      : `<p class="no-results">No project matches &ldquo;${esc(filter)}&rdquo;.</p>`);
  view.querySelectorAll(".card").forEach(el =>
    el.addEventListener("click", () => go(el.dataset.key)));
}

/* ---------- CDLC epic ---------- */
function crumbs(parts) {
  return `<nav class="crumbs" aria-label="Breadcrumb">` + parts.map((p,i) =>
    (i ? `<span class="sep">/</span>` : "") +
    (p.to !== undefined ? `<button data-to="${esc(p.to)}">${esc(p.label)}</button>`
                        : `<span>${esc(p.label)}</span>`)).join("") + `</nav>`;
}

function wireCrumbs() {
  view.querySelectorAll(".crumbs button").forEach(el =>
    el.addEventListener("click", () => go(el.dataset.to)));
}

let branchId = "instructional";

function viewEpic(key) {
  if (key !== "CDLC" || !CDLC) return viewSpace(key);
  const branch = CDLC.branches.find(b => b.id === branchId) || CDLC.branches[0];
  const stages = branch.stageIds.map(id => CDLC.stages.find(s => s.id === id)).filter(Boolean);

  /* Topic repeats per teaching unit, so it is drawn twice plus a continuation */
  const boxes = [];
  stages.forEach(st => {
    if (st.id.startsWith("topic"))
      boxes.push({...st, label:"Topic 1"}, {...st, label:"Topic 2"}, {...st, label:"Topic N", ghost:true});
    else boxes.push({...st, label:st.name});
  });
  let n = 0;

  view.innerHTML =
    crumbs([{label:"Projects", to:""},{label:"CDLC"}]) +
    `<div class="col">
       <div class="page-head"><h1>CDLC Epic</h1></div>
       ${tabs("epic")}
       <p class="lede">One Epic is one course.</p>

       <h2>Its workflow</h2>
       ${workflowGraph(CDLC.epic.transitions)}

       <h2>Course Type</h2>
       <div class="fork">` +
         CDLC.branches.map(b =>
           `<button class="fork-branch" data-b="${esc(b.id)}" aria-pressed="${b.id===branch.id}">
              <span class="fork-type">${esc(b.label)}</span>
              <span class="fork-line"><span class="fork-k">Epic creates</span>
                <span class="fork-v">${b.stageIds.filter(i=>!i.startsWith("topic")&&i!=="digitization")
                  .map(i=>esc((CDLC.stages.find(s=>s.id===i)||{}).name)).join(" &middot; ")}</span></span>
            </button>`).join("") +
    `  </div>

       <h2>Children of the Epic</h2>
       <div class="stages vertical">` +
         boxes.map((b,i) => {
           if (!b.ghost) n++;
           return (i ? `<span class="seq-arrow">&darr;</span>` : "") +
           `<button class="stage${b.ghost?" ghost":""}" data-stage="${esc(b.id)}">
              <span class="stage-head">
                <span class="stage-n">${b.ghost ? "&hellip;" : "Step "+n}</span>
                <span class="stage-name">${esc(b.label)}</span>
              </span>
              <span class="stage-row">
                <span class="stage-type">${esc(b.type)}</span>
                <span class="stage-type">${b.subtasks.length ? b.subtasks.length+" subtasks" : "single ticket"}</span>
              </span>
            </button>`; }).join("") +
    `  </div>
     </div>`;

  wireCrumbs(); wireTabs();
  view.querySelectorAll(".fork-branch").forEach(el =>
    el.addEventListener("click", () => { branchId = el.dataset.b; viewEpic(key); }));
  view.querySelectorAll(".stage").forEach(el =>
    el.addEventListener("click", () => go("CDLC/"+el.dataset.stage)));
}

/* ---------- a single stage ---------- */
function viewStage(key, id) {
  const s = CDLC && CDLC.stages.find(x=>x.id===id);
  if (!s) return viewEpic(key);

  view.innerHTML =
    crumbs([{label:"Projects", to:""},{label:"CDLC", to:"CDLC"},{label:s.name}]) +
    `<div class="page-head">
       <p class="eyebrow">Child of CDLC Epic</p>
       <h1>${esc(s.name)}</h1>
     </div>

     ${facts(s)}

     <h2>Its workflow</h2>
     ${workflowGraph(s.transitions, s.example)}` +

    (s.subtasks.length
      ? `<h2>Subtasks beneath it</h2>
         <p class="lede" style="margin-bottom:var(--space-200)">Open any one to see its own workflow.</p>
         <div class="rows">` + s.subtasks.map((t,i) =>
           `<button class="row" data-sub="${esc(t.id)}"><span class="row-n">${i+1}</span>
              <span class="row-name">${esc(t.name)}</span>
              <span class="row-type">${esc(t.type)}</span>
              <span class="row-go">&rsaquo;</span></button>`).join("") + `</div>`
      : `<div class="terminal">This stage is a single ticket. It has no subtasks beneath it.</div>`);

  wireCrumbs();
  view.querySelectorAll(".rows button.row").forEach(el =>
    el.addEventListener("click", () => go("CDLC/"+s.id+"/"+el.dataset.sub)));
}

/* ---------- a single subtask: the bottom of the tree ---------- */
function viewSubtask(key, stageId, subId) {
  const st = CDLC && CDLC.stages.find(x=>x.id===stageId);
  const t  = st && st.subtasks.find(x=>x.id===subId);
  if (!t) return viewStage(key, stageId);

  view.innerHTML =
    crumbs([{label:"Projects", to:""},{label:"CDLC", to:"CDLC"},
            {label:st.name, to:"CDLC/"+st.id},{label:t.name}]) +
    `<div class="page-head">
       <p class="eyebrow">Subtask of ${esc(st.name)}</p>
       <h1>${esc(t.name)}</h1>
     </div>` +
    facts(t, t.blurb) +
    `<h2>Its workflow</h2>
     ${workflowGraph(t.transitions, t.example)}
     <div class="terminal">This is the bottom of the tree. Jira sub-tasks cannot have
        children of their own, so nothing hangs beneath this.</div>`;

  wireCrumbs();
}

/* ---------- other spaces ---------- */
function viewSpace(key) {
  const p = PROJECTS.find(x=>x.key===key);
  view.innerHTML =
    crumbs([{label:"Projects", to:""},{label:p.key}]) +
    `<div class="space-head">${avatar(p,"lg")}
       <div><h1>${esc(p.name)}</h1>
         <p class="lede">${esc(p.key)} &middot; ${esc(p.style)} ${p.type.toLowerCase()} project
            &middot; ${p.issues.toLocaleString()} issues</p></div></div>
     <div class="empty"><h2>Nothing in this space yet</h2>
       <p>This is where ${esc(p.key)}&rsquo;s contents will go. Nothing has been added for it so far.</p></div>`;
  wireCrumbs();
}

/* ---------- render ---------- */
function render() {
  const { key, stage, sub } = route();
  search.parentElement.style.visibility = key ? "hidden" : "";
  if (key === "CDLC" && stage === "fields") viewFields();
  else if (key === "CDLC" && stage === "history" && sub) viewChange(sub);
  else if (key === "CDLC" && stage === "history") viewHistory();
  else if (key === "CDLC" && stage && sub) viewSubtask(key, stage, sub);
  else if (key === "CDLC" && stage) viewStage(key, stage);
  else if (key === "CDLC")     viewEpic(key);
  else if (key)                viewSpace(key);
  else                         viewProjects(search.value);
  refreshRequestLink();
  window.scrollTo({ top:0 });
}
/* The button opens a change request on GitHub with the page already filled in,
   so a request always says which page it came from. */
const REPO = "https://github.com/palsampurna16-prog/cdlc-workflow-record";
function refreshRequestLink() {
  const heading = document.querySelector("#view h1");
  const where = (heading ? heading.textContent.trim() : "CDLC Workflow Record");
  const url = location.href;
  const body =
    "**Which page**\n" + where + "\n" + url +
    "\n\n**What should change**\n\n\n**Why / what is wrong today**\n\n\n**Your name**\n";
  document.getElementById("req").href =
    REPO + "/issues/new?labels=" + encodeURIComponent("change request") +
    "&title=" + encodeURIComponent("Change request: " + where) +
    "&body="  + encodeURIComponent(body);
}

window.addEventListener("hashchange", render);
search.addEventListener("input", () => { if (!route().key) viewProjects(search.value); });
document.getElementById("home-link").addEventListener("click", () => go(""));
render();
</script>

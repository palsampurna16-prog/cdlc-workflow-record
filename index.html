<style>
/* Atlassian / Jira design language, drill-down navigation. */

:root {
  color-scheme: light;
  --paper:#F7F8F9; --surface:#FFFFFF; --surface-2:#F1F2F4; --surface-3:#EBECF0;
  --ink:#172B4D; --ink-2:#44546F; --muted:#626F86;
  --line:#DFE1E6; --line-soft:#EBECF0;
  --accent:#0052CC; --accent-hover:#0065FF; --accent-soft:#E9F2FF; --accent-ink:#FFFFFF;
  --cat-new-fg:#44546F;  --cat-new-bg:#DFE1E6;
  --cat-ind-fg:#0052CC;  --cat-ind-bg:#DEEBFF;
  --cat-done-fg:#006644; --cat-done-bg:#E3FCEF;
  --dead-fg:#626F86;     --dead-bg:#EBECF0;
  --warn-fg:#974F0C;     --warn-bg:#FFF0B3;
  --err-fg:#BF2600;      --err-bg:#FFEBE6;
  --shadow: 0 1px 1px rgba(9,30,66,.25), 0 0 1px 1px rgba(9,30,66,.13);
  --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu,
          "Fira Sans", "Droid Sans", "Helvetica Neue", sans-serif;
  --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --paper:#1D2125; --surface:#22272B; --surface-2:#282E33; --surface-3:#2C333A;
    --ink:#B6C2CF; --ink-2:#9FADBC; --muted:#8C9BAB;
    --line:#38414A; --line-soft:#2C333A;
    --accent:#579DFF; --accent-hover:#85B8FF; --accent-soft:#1C2B41; --accent-ink:#1D2125;
    --cat-new-fg:#9FADBC;  --cat-new-bg:#2C333A;
    --cat-ind-fg:#85B8FF;  --cat-ind-bg:#09326C;
    --cat-done-fg:#7EE2B8; --cat-done-bg:#164B35;
    --dead-fg:#8C9BAB;     --dead-bg:#303940;
    --warn-fg:#F5CD47;     --warn-bg:#533F04;
    --err-fg:#FD9891;      --err-bg:#5D1F1A;
    --shadow: 0 1px 1px rgba(3,4,4,.5), 0 0 1px 1px rgba(3,4,4,.35);
  }
}

:root[data-theme="dark"] {
  color-scheme: dark;
  --paper:#1D2125; --surface:#22272B; --surface-2:#282E33; --surface-3:#2C333A;
  --ink:#B6C2CF; --ink-2:#9FADBC; --muted:#8C9BAB;
  --line:#38414A; --line-soft:#2C333A;
  --accent:#579DFF; --accent-hover:#85B8FF; --accent-soft:#1C2B41; --accent-ink:#1D2125;
  --cat-new-fg:#9FADBC;  --cat-new-bg:#2C333A;
  --cat-ind-fg:#85B8FF;  --cat-ind-bg:#09326C;
  --cat-done-fg:#7EE2B8; --cat-done-bg:#164B35;
  --dead-fg:#8C9BAB;     --dead-bg:#303940;
  --warn-fg:#F5CD47;     --warn-bg:#533F04;
  --err-fg:#FD9891;      --err-bg:#5D1F1A;
  --shadow: 0 1px 1px rgba(3,4,4,.5), 0 0 1px 1px rgba(3,4,4,.35);
}

* { box-sizing: border-box; }

body {
  margin: 0; background: var(--paper); color: var(--ink);
  font-family: var(--font); font-size: 14px; line-height: 1.4286;
  -webkit-font-smoothing: antialiased;
}
a { color: var(--accent); }
a:hover { color: var(--accent-hover); }

.wrap {
  max-width: 860px; margin: 0 auto;
  padding: 28px clamp(16px, 3vw, 32px) 96px;
}

/* ---------- breadcrumb ---------- */

.crumbs {
  display: flex; flex-wrap: wrap; align-items: center; gap: 4px;
  font-size: 13px; margin-bottom: 20px; min-height: 26px;
}
.crumbs button {
  font: inherit; border: 0; background: none; color: var(--accent);
  cursor: pointer; padding: 3px 6px; margin-left: -6px; border-radius: 3px;
}
.crumbs button:hover { background: var(--surface-3); }
.crumbs button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.crumbs .sep { color: var(--muted); }
.crumbs .here { color: var(--ink-2); padding: 3px 0; }

/* ---------- headings ---------- */

.eyebrow {
  font-size: 11px; font-weight: 600; letter-spacing: .08em;
  text-transform: uppercase; color: var(--muted); margin: 0 0 6px;
}
h1 {
  font-size: 24px; font-weight: 600; line-height: 1.18; letter-spacing: -.008em;
  margin: 0 0 6px; color: var(--ink); overflow-wrap: anywhere;
}
.lede { margin: 0 0 22px; color: var(--ink-2); max-width: 68ch; }

h2 {
  font-size: 13px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase;
  color: var(--muted); margin: 26px 0 10px;
}

/* ---------- branch cards (home) ---------- */

.branches { display: grid; gap: 8px; }
.branch {
  display: flex; align-items: center; gap: 14px; width: 100%; text-align: left;
  font: inherit; cursor: pointer; padding: 16px 18px;
  background: var(--surface); border: 1px solid var(--line);
  border-radius: 3px; box-shadow: var(--shadow); color: var(--ink);
}
.branch:hover { border-color: var(--accent); }
.branch:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.branch .n {
  font-size: 22px; font-weight: 600; color: var(--accent);
  font-variant-numeric: tabular-nums; min-width: 46px;
}
.branch .t { flex: 1; min-width: 0; }
.branch .t b { display: block; font-size: 15px; font-weight: 600; }
.branch .t span { display: block; font-size: 13px; color: var(--muted); margin-top: 2px; }
.branch .go { color: var(--muted); font-size: 18px; }

/* ---------- lists ---------- */

.filter {
  width: 100%; font-family: var(--font); font-size: 14px; color: var(--ink);
  background: var(--surface-2); border: 2px solid var(--line);
  border-radius: 3px; padding: 7px 10px; margin-bottom: 12px;
}
.filter:focus { background: var(--surface); border-color: var(--accent); outline: none; }
.filter::placeholder { color: var(--muted); }

.count-line {
  font-size: 12px; color: var(--muted); margin: 0 0 10px;
  font-variant-numeric: tabular-nums;
}

.items { display: flex; flex-direction: column; border-top: 1px solid var(--line-soft); }
.item {
  display: flex; align-items: baseline; gap: 12px; width: 100%; text-align: left;
  font: inherit; cursor: pointer; padding: 11px 8px; margin: 0;
  background: none; border: 0; border-bottom: 1px solid var(--line-soft); color: var(--ink);
}
.item:hover { background: var(--surface-2); }
.item:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
.item .lbl { flex: 1; min-width: 0; font-size: 14px; font-weight: 500; overflow-wrap: anywhere; }
.item .meta { font-size: 12px; color: var(--muted); text-align: right; white-space: nowrap; }

.group-h {
  font-size: 12px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase;
  color: var(--muted); padding: 18px 8px 6px; border-bottom: 2px solid var(--line);
}

/* ---------- detail ---------- */

.facts {
  display: grid; grid-template-columns: max-content 1fr; gap: 8px 16px;
  padding: 14px 16px; background: var(--surface); border: 1px solid var(--line);
  border-radius: 3px; box-shadow: var(--shadow); margin-bottom: 4px; font-size: 13px;
}
.facts dt {
  font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase;
  color: var(--muted); padding-top: 2px;
}
.facts dd { margin: 0; color: var(--ink-2); overflow-wrap: anywhere; }
.facts dd strong { color: var(--ink); font-weight: 600; }

.prose { margin: 0 0 14px; color: var(--ink-2); max-width: 68ch; }
.prose code, .facts code {
  font-family: var(--mono); font-size: 12px; background: var(--surface-2);
  border: 1px solid var(--line-soft); padding: 1px 4px; border-radius: 3px; color: var(--ink);
}

.chips { display: flex; flex-wrap: wrap; gap: 4px; }
.chip {
  display: inline-block; font-size: 11px; font-weight: 700; letter-spacing: .06em;
  text-transform: uppercase; padding: 2px 6px; border-radius: 3px; white-space: nowrap;
}
.chip.new  { color: var(--cat-new-fg);  background: var(--cat-new-bg); }
.chip.ind  { color: var(--cat-ind-fg);  background: var(--cat-ind-bg); }
.chip.done { color: var(--cat-done-fg); background: var(--cat-done-bg); }
.chip.plain {
  text-transform: none; letter-spacing: 0; font-weight: 500; font-size: 12px;
  color: var(--ink-2); background: var(--surface-2); border: 1px solid var(--line);
}
.chip.b-active  { color: var(--cat-done-fg); background: var(--cat-done-bg); }
.chip.b-dormant { color: var(--warn-fg);     background: var(--warn-bg); }
.chip.b-never   { color: var(--err-fg);      background: var(--err-bg); }
.chip.ok   { color: var(--cat-done-fg); background: var(--cat-done-bg); }
.chip.open { color: var(--cat-ind-fg);  background: var(--cat-ind-bg); }
.chip.dead { color: var(--dead-fg);     background: var(--dead-bg); }

button.chip { cursor: pointer; border: 1px solid transparent; font-family: var(--font); }
button.chip:hover { border-color: var(--accent); }
button.chip:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

/* transitions */
.flow { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 6px; }
.flow li {
  display: flex; flex-wrap: wrap; align-items: center; gap: 6px;
  font-size: 13px; padding: 7px 10px;
  background: var(--surface); border: 1px solid var(--line-soft); border-radius: 3px;
}
.flow .arrow { color: var(--accent); font-weight: 700; }
.flow .lab { color: var(--ink-2); font-size: 12px; margin-left: 2px; }
.flow .from-any {
  font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase;
  color: var(--muted);
}

.linklist { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 3px; }
.linklist li { font-size: 13px; color: var(--ink-2); display: flex; gap: 8px; }
.linklist a, .linklist code { font-family: var(--mono); font-size: 12px; flex: 0 0 auto; }
.linklist s { color: var(--dead-fg); }

.empty { padding: 26px 0; color: var(--muted); font-style: italic; }

.note {
  font-size: 12px; color: var(--muted); margin-top: 26px;
  padding-top: 14px; border-top: 1px solid var(--line);
}
.note a { color: var(--accent); }

mark { background: #FFF0B3; color: #172B4D; padding: 0 1px; border-radius: 2px; }
:root[data-theme="dark"] mark { background: #533F04; color: #F8E6A0; }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) mark { background: #533F04; color: #F8E6A0; }
}

@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>

/* One screen at a time. `path` drives everything:
     []                          home
     ["workflows"]               list
     ["workflows", name]         detail
   Same for worktypes, process, fields, changes. */

const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;" }[c]));
const hl = (t, q) => {
  if (!q) return esc(t);
  const i = t.toLowerCase().indexOf(q);
  if (i < 0) return esc(t);
  return esc(t.slice(0,i)) + "<mark>" + esc(t.slice(i,i+q.length)) + "</mark>" + esc(t.slice(i+q.length));
};

// ---- derived indexes -------------------------------------------------
const WORKTYPES = [];                       // flat [name, family, level, statuses, refs, workflow]
for (const [family, rows] of DATA)
  for (const [n, lvl, sts, refs, wf] of rows) WORKTYPES.push({ n, family, lvl, sts, refs: refs||[], wf });

const BY_WF = {};                           // workflow -> work types using it
for (const w of WORKTYPES) (BY_WF[w.wf] = BY_WF[w.wf] || []).push(w);

const LOG_BY_KEY = Object.fromEntries(LOG.map(e => [e[0], e]));

function usageOf(name) {
  const u = USAGE[name.trim()] || [0,0];
  const state = u[0] === 0 ? "never" : (u[1] === 0 ? "dormant" : "active");
  return { state, ever: u[0], y1: u[1],
    label: state === "never" ? "Never used" : state === "dormant" ? "Dormant" : "Active" };
}

// a workflow is active if any work type using it is active
function wfUsage(wf) {
  const list = BY_WF[wf] || [];
  const ever = list.reduce((a,w) => a + usageOf(w.n).ever, 0);
  const y1   = list.reduce((a,w) => a + usageOf(w.n).y1, 0);
  return { ever, y1, state: ever === 0 ? "never" : (y1 === 0 ? "dormant" : "active") };
}

// change tickets touching a workflow = union of refs of its work types
function changesFor(wf) {
  const s = new Set();
  for (const w of BY_WF[wf] || []) for (const r of w.refs) if (LOG_BY_KEY[r]) s.add(r);
  return [...s];
}

  ["process",   "The process",   () => PROCESS.length,
   "The seven stages of the content lifecycle, in order, and who owns each."],
  ["fields",    "Fields",        () => FIELDS.reduce((a,g) => a + g[2].length, 0),

let path = [];
let query = "";

const view = document.getElementById("view");
const crumbs = document.getElementById("crumbs");

function go(p) { path = p; query = ""; render(); window.scrollTo({ top: 0, behavior: "smooth" }); }

// ---- breadcrumb ------------------------------------------------------
function renderCrumbs() {
  const b = BRANCHES.find(x => x[0] === path[0]);
  const parts = [["CDLC", []]];
  if (b) parts.push([b[1], [b[0]]]);
  if (path.length > 1) parts.push([path[1], null]);

  crumbs.innerHTML = parts.map(([label, target], i) => {
    const last = i === parts.length - 1;
    const sep = i ? `<span class="sep">/</span>` : "";
    return sep + (last || !target
      ? `<span class="here">${esc(label)}</span>`
      : `<button data-go='${JSON.stringify(target)}'>${esc(label)}</button>`);
  }).join("");

  for (const btn of crumbs.querySelectorAll("button[data-go]"))
    btn.addEventListener("click", () => go(JSON.parse(btn.dataset.go)));
}

// ---- shared pieces ---------------------------------------------------
const chip = (n, cls) => `<span class="chip ${cls || (CAT[n] || "ind")}">${esc(n)}</span>`;

function itemList(rows, onPick) {
  // rows: [{ key, label, meta }]
  const q = query.toLowerCase();
  const hit = rows.filter(r => !q || (r.label + " " + (r.search || "")).toLowerCase().includes(q));
  let html = `<input class="filter" id="filter" type="search" placeholder="Filter…" value="${esc(query)}" aria-label="Filter">`;
  html += `<p class="count-line">${hit.length} of ${rows.length}</p>`;
  if (!hit.length) return html + `<p class="empty">Nothing matches that.</p>`;

  html += `<div class="items">`;
  let group = null;
  for (const r of hit) {
    if (r.group && r.group !== group) { group = r.group; html += `<div class="group-h">${esc(group)}</div>`; }
    html += `<button class="item" data-key="${esc(r.key)}">` +
            `<span class="lbl">${hl(r.label, q)}</span>` +
            `<span class="meta">${r.meta || ""}</span></button>`;
  }
  return html + `</div>`;
}

function wireList(onPick) {
  const f = document.getElementById("filter");
  if (f) {
    f.addEventListener("input", () => {
      query = f.value;
      const at = f.selectionStart;
      render(true);
      const nf = document.getElementById("filter");
      if (nf) { nf.focus(); nf.setSelectionRange(at, at); }
    });
  }
  for (const b of view.querySelectorAll(".item[data-key]"))
    b.addEventListener("click", () => onPick(b.dataset.key));
}

function jiraLink(k) {
  return `<a href="https://skillcatapp.atlassian.net/browse/${k}" target="_blank" rel="noopener">${k}</a>`;
}

     <p class="lede">How this project is put together in Jira, and how it got that way.

function listWorkflows() {
  const rows = Object.keys(TRANSITIONS).sort().map(w => {
    const u = wfUsage(w), n = (BY_WF[w] || []).length;
    return { key: w, label: w, search: (BY_WF[w] || []).map(x => x.n).join(" "),
      meta: `${n} work type${n === 1 ? "" : "s"} · ${TRANSITIONS[w].filter(e => e.kind !== "start").length} transitions` +
            (u.state === "active" ? "" : ` · <span class="chip b-${u.state}">${u.state}</span>`) };
  });
  view.innerHTML = `<h1>Workflows</h1><p class="lede">47 workflows drive the 69 work types.
    Two work types naming the same workflow really are the same workflow.</p>` + itemList(rows);
  wireList(k => go(["workflows", k]));
}

function detailWorkflow(name) {
  const edges = TRANSITIONS[name];
  if (!edges) return go(["workflows"]);
  const users = BY_WF[name] || [];
  const u = wfUsage(name);
  const start = edges.filter(e => e.kind === "start");
  const norm = edges.filter(e => e.kind === "edge");
  const any = edges.filter(e => e.kind === "any");
  const sts = [...new Set(users.flatMap(w => w.sts))];
  const ch = changesFor(name);

  view.innerHTML =
    `<p class="eyebrow">Workflow</p><h1>${esc(name)}</h1>
     <dl class="facts">
       <dt>Statuses</dt><dd><div class="chips">${sts.map(s => chip(s)).join("")}</div></dd>
       <dt>Used by</dt><dd>${users.length} work type${users.length === 1 ? "" : "s"}</dd>
       <dt>Tickets</dt><dd>${u.ever.toLocaleString()} ever · ${u.y1.toLocaleString()} in the last 12 months
         <span class="chip b-${u.state}">${u.state}</span></dd>
     </dl>
     <h2>Transitions</h2>
     <ul class="flow">` +
    start.map(e => `<li><span class="from-any">Starts at</span>${chip(e.to)}</li>`).join("") +
    norm.map(e => `<li>${e.from.map(f => chip(f)).join("")}<span class="arrow">&rarr;</span>` +
                  `${chip(e.to)}<span class="lab">${esc(e.label)}</span></li>`).join("") +
    any.map(e => `<li><span class="from-any">From any</span><span class="arrow">&rarr;</span>` +
                 `${chip(e.to)}<span class="lab">${esc(e.label)}</span></li>`).join("") +
    `</ul>
     <h2>Work types using it</h2><div class="chips">` +
    users.map(w => `<button class="chip plain" data-wt="${esc(w.n)}">${esc(w.n)}</button>`).join("") +
    `</div>` +
    (ch.length ? `<h2>Changes that touched it</h2><div class="chips">` +
      ch.map(k => `<button class="chip plain" data-ch="${k}">${k} · ${esc(LOG_BY_KEY[k][4])}</button>`).join("") +
      `</div>` : "");

  for (const b of view.querySelectorAll("[data-wt]")) b.addEventListener("click", () => go(["worktypes", b.dataset.wt]));
  for (const b of view.querySelectorAll("[data-ch]")) b.addEventListener("click", () => go(["changes", b.dataset.ch]));
}

function listWorktypes() {
  const rows = WORKTYPES.map(w => {
    const u = usageOf(w.n);
    return { key: w.n, label: w.n, group: w.family, search: w.sts.join(" ") + " " + w.wf,
      meta: `${w.sts.length} statuses · ${u.ever} tickets` +
            (u.state === "active" ? "" : ` · <span class="chip b-${u.state}">${u.state}</span>`) };
  });
  view.innerHTML = `<h1>Work types</h1><p class="lede">Every work item type in the project,
    grouped the way the team talks about them.</p>` + itemList(rows);
  wireList(k => go(["worktypes", k]));
}

  if (!w) return go(["worktypes"]);
  const u = usageOf(w.n);

      `</div>` : "");

  for (const b of view.querySelectorAll("[data-wf]")) b.addEventListener("click", () => go(["workflows", b.dataset.wf]));
  for (const b of view.querySelectorAll("[data-ch]")) b.addEventListener("click", () => go(["changes", b.dataset.ch]));
  for (const b of view.querySelectorAll("[data-st]")) b.addEventListener("click", () => go(["process", b.dataset.st]));
}

function listProcess() {
  const rows = PROCESS.map(p => ({ key: String(p[0]), label: `${String(p[0]).padStart(2,"0")} · ${p[1]}`,
    search: p[2] + " " + p[3], meta: esc(p[2]) }));
  view.innerHTML = `<h1>The process</h1><p class="lede">Seven stages, in order, from the SOP.
    Each names its owner, the work types involved, and what it sets off next.</p>` + itemList(rows);
  wireList(k => go(["process", k]));
}

function detailProcess(n) {
  const p = PROCESS.find(x => String(x[0]) === String(n));
  if (!p) return go(["process"]);
  const [num, title, owner, summary, who, types, triggers, mism] = p;

  view.innerHTML =
    `<p class="eyebrow">Stage ${String(num).padStart(2,"0")}</p><h1>${esc(title)}</h1>
     <p class="prose">${esc(summary)}</p>
     <dl class="facts">
       <dt>Owner</dt><dd>${esc(owner)}</dd>
       <dt>Who</dt><dd><div class="chips">${who.map(x => `<span class="chip plain">${esc(x)}</span>`).join("")}</div></dd>
       <dt>Work types</dt><dd><div class="chips">${types.map(t =>
         `<button class="chip plain" data-wt="${esc(t)}">${esc(t)}</button>`).join("")}</div></dd>
     </dl>
     <h2>Triggers next</h2>
     <ul class="flow">` +
    triggers.map(([f, t]) => `<li><code>${esc(f)}</code><span class="arrow">&rarr;</span><span>${esc(t)}</span></li>`).join("") +
    `</ul>` +
    (mism.length ? `<h2>Where the SOP disagrees with Jira</h2><ul class="linklist">` +
      mism.map(([d, j]) => `<li><span>SOP says <code>${esc(d)}</code> — Jira has <strong>${esc(j)}</strong></span></li>`).join("") +
      `</ul>` : "");

  for (const b of view.querySelectorAll("[data-wt]")) b.addEventListener("click", () => go(["worktypes", b.dataset.wt]));
}

function listFields() {
  const rows = [];
  for (const [owner, note, fs] of FIELDS)
    for (const f of fs) rows.push({ key: f[0], label: f[0], group: owner,
      search: f[1] + " " + f[2] + " " + f[3], meta: esc(f[2]) });
  view.innerHTML = `<h1>Fields</h1><p class="lede">Every field on a CDLC work item, grouped by
    the role responsible for filling it. Eighteen have no documented owner.</p>` + itemList(rows);
  wireList(k => go(["fields", k]));
}

function detailField(name) {
  let owner = null, note = null, f = null;
  for (const [o, nt, fs] of FIELDS) { const hit = fs.find(x => x[0] === name); if (hit) { owner = o; note = nt; f = hit; } }
  if (!f) return go(["fields"]);
  const [n, type, scope, when, tk, kind] = f;
  const KIND = { val: "Enforced by a validator", auto: "Set by automation", note: "See the change" };

  view.innerHTML =
    `<p class="eyebrow">Field</p><h1>${esc(n)}</h1>
     <dl class="facts">
       <dt>Filled by</dt><dd><strong>${esc(owner)}</strong></dd>
       <dt>Type</dt><dd><code>${esc(type)}</code></dd>
       <dt>Scope</dt><dd>${esc(scope)}</dd>
       <dt>When</dt><dd>${esc(when)}</dd>` +
    (tk ? `<dt>Rule</dt><dd>${esc(KIND[kind] || KIND.note)} — <button class="chip plain" data-ch="${tk}">${tk}</button></dd>` : "") +
    `</dl><p class="prose">${esc(note)}</p>`;

  for (const b of view.querySelectorAll("[data-ch]")) b.addEventListener("click", () => go(["changes", b.dataset.ch]));
}

const MONTHS = ["January","February","March","April","May","June","July","August","September","October","November","December"];
const monthOf = d => { const [y,m] = d.split("-"); return MONTHS[+m-1] + " " + y; };

function listChanges() {
  const rows = LOG.map(e => ({ key: e[0], label: e[4], group: monthOf(e[1]),
    search: e[0] + " " + e[5] + " " + e[6].join(" "),
    meta: `${e[0]} · <span class="chip ${e[2]}">${esc(e[3])}</span>` }));
  view.innerHTML = `<h1>Change history</h1><p class="lede">Forty changes made to this project's
    Jira setup between November 2025 and August 2026, newest first.</p>` + itemList(rows);
  wireList(k => go(["changes", k]));
}

function detailChange(key) {
  const e = LOG_BY_KEY[key];
  if (!e) return go(["changes"]);
  const [k, date, state, label, title, what, tags, before, after, subs] = e;
  const affected = WORKTYPES.filter(w => w.refs.includes(k));

  view.innerHTML =
    `<p class="eyebrow">${esc(monthOf(date))}</p><h1>${esc(title)}</h1>
     <dl class="facts">
       <dt>Ticket</dt><dd>${jiraLink(k)}</dd>
       <dt>State</dt><dd><span class="chip ${state}">${esc(label)}</span></dd>
       <dt>Areas</dt><dd><div class="chips">${tags.map(t => `<span class="chip plain">${esc(t)}</span>`).join("")}</div></dd>
     </dl>
     <p class="prose">${what}</p>` +
    (before || after
      ? `<dl class="facts">` +
        (before ? `<dt>Was</dt><dd>${esc(before)}</dd>` : "") +
        (after  ? `<dt>Became</dt><dd><strong>${esc(after)}</strong></dd>` : "") + `</dl>`
      : "") +
    (affected.length ? `<h2>Work types affected</h2><div class="chips">` +
      affected.map(w => `<button class="chip plain" data-wt="${esc(w.n)}">${esc(w.n)}</button>`).join("") + `</div>` : "") +
    (subs.length ? `<h2>Sub-tickets</h2><ul class="linklist">` +
      subs.map(([sk, ss, st]) => `<li>${jiraLink(sk)}${ss === DEAD ? `<s>${esc(st)}</s>` : `<span>${esc(st)}</span>`}</li>`).join("") +
      `</ul>` : "");

  for (const b of view.querySelectorAll("[data-wt]")) b.addEventListener("click", () => go(["worktypes", b.dataset.wt]));
}

// ---- router ----------------------------------------------------------
function render(keepQuery) {
  if (!keepQuery && false) query = "";
  renderCrumbs();
  const [branch, item] = path;
  if (!branch) return viewHome();
  if (branch === "workflows") return item ? detailWorkflow(item) : listWorkflows();
  if (branch === "worktypes") return item ? detailWorktype(item) : listWorktypes();
  if (branch === "process")   return item ? detailProcess(item)  : listProcess();
  if (branch === "fields")    return item ? detailField(item)    : listFields();
  if (branch === "changes")   return item ? detailChange(item)   : listChanges();
  return viewHome();
}

render();
</script>
</body>
</html>

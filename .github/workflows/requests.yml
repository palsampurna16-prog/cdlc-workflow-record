name: Update the requests sheet

# Rewrites requests.csv whenever someone raises or updates a change request,
# and once a day in case an event was missed.
on:
  issues:
    types: [opened, edited, closed, reopened, deleted, labeled, unlabeled]
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: read

concurrency:
  group: requests
  cancel-in-progress: false

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: node scripts/make-requests.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Commit if it changed
        run: |
          if git diff --quiet requests.csv; then
            echo "No change."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add requests.csv
          git commit -m "chore: update the requests sheet [skip ci]"
          git push

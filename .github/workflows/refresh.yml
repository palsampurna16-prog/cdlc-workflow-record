name: Refresh usage counts

# Re-measures work type usage against Jira and commits the result.
# Runs Mondays at 06:00 UTC, or on demand from the Actions tab.
on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-usage
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Query Jira and rewrite the usage block
        env:
          JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
        run: node scripts/refresh-usage.mjs

      - name: Rebuild the page
        run: node build.mjs

      - name: Commit if anything changed
        run: |
          if git diff --quiet; then
            echo "No change to commit."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/page.html index.html
          git commit -m "chore: refresh CDLC usage counts"
          git push
